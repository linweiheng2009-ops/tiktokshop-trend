<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 · 页面没找到</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #0a0a0a;
    color: #e8e8e8;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .box {
    max-width: 480px;
    text-align: center;
  }
  h1 {
    font-size: 96px;
    font-weight: 900;
    margin: 0;
    background: linear-gradient(135deg, #ff2d7a, #00d4ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  h2 { font-size: 22px; margin: 8px 0 24px; }
  p { color: #888; font-size: 14px; line-height: 1.6; margin: 0 0 32px; }
  a {
    display: inline-block;
    padding: 12px 24px;
    background: linear-gradient(135deg, #ff2d7a, #ff6b35);
    color: #fff;
    text-decoration: none;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
  }
  a:hover { opacity: 0.9; }
  .meta {
    margin-top: 32px;
    color: #555;
    font-size: 11px;
  }
</style>
</head>
<body>
<div class="box">
  <h1>404</h1>
  <h2>页面没找到</h2>
  <p>你访问的链接可能已过期，或者输入有误。<br>回到首页看看 TikTok Shop 趋势榜吧。</p>
  <a href="/">📊 回到首页</a>
  <div class="meta">TikTok Shop 趋势榜 · 公开榜 · 趋势导向</div>
</div>
</body>
</html>
